[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-picker"
version = "0.2.0"
description = "Desktop tool for auditioning and picking sound assets for a game"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Pinned to the version that passed the step-1 codec check (README).
    "PySide6>=6.11.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff"]

[project.scripts]
audio-picker = "audio_picker.cli:main"

[tool.setuptools.packages.find]
include = ["audio_picker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
